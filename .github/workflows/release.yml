name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0); required for manual runs"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Resolve checkout ref
        id: ref
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -z "${INPUT_TAG}" ]; then
              echo "workflow_dispatch requires inputs.tag (e.g. v0.1.0)" >&2
              exit 1
            fi
            if [[ ! "${INPUT_TAG}" =~ ^v[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "invalid tag format: ${INPUT_TAG}" >&2
              exit 1
            fi
            echo "ref=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "ref=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "unsupported event/ref: ${EVENT_NAME} ${GITHUB_REF}" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify checkout matches release version
        id: ver
        env:
          VERSION: ${{ steps.ref.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse --short HEAD)"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION} at $(git rev-parse HEAD)"
          # Ensure the requested tag exists and points at HEAD when releasing a tag.
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "${VERSION}")"
            head_commit="$(git rev-parse HEAD)"
            if [ "${tag_commit}" != "${head_commit}" ]; then
              echo "tag ${VERSION} (${tag_commit}) does not match HEAD (${head_commit})" >&2
              exit 1
            fi
          fi

      - name: Run tests
        run: |
          go vet ./...
          go test ./internal/... ./cmd/... ./e2e/... -count=1

      - name: Cross-compile
        env:
          VERSION: ${{ steps.ref.outputs.version }}
          COMMIT: ${{ steps.ver.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/drswith/easy-proxy-switch-cli/cmd.version=${VERSION#v} -X github.com/drswith/easy-proxy-switch-cli/cmd.commit=${COMMIT}"
          build() {
            local goos="$1" goarch="$2" out="$3"
            echo "-> ${out}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "$LDFLAGS" -o "dist/${out}" ./cmd/eps
          }
          build darwin arm64 eps-darwin-arm64
          build darwin amd64 eps-darwin-amd64
          build linux  amd64 eps-linux-amd64
          build linux  arm64 eps-linux-arm64
          build windows amd64 eps-windows-amd64.exe
          build windows arm64 eps-windows-arm64.exe
          (
            cd dist
            sha256sum eps-* > checksums.txt
          )
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ref.outputs.version }}
          name: ${{ steps.ref.outputs.version }}
          generate_release_notes: true
          files: |
            dist/eps-darwin-arm64
            dist/eps-darwin-amd64
            dist/eps-linux-amd64
            dist/eps-linux-arm64
            dist/eps-windows-amd64.exe
            dist/eps-windows-arm64.exe
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
