name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./internal/... ./cmd/... -count=1

      - name: Build
        shell: bash
        run: |
          mkdir -p bin
          go build -o bin/ezp ./cmd/ezp

  e2e:
    name: e2e (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install shells
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zsh fish curl ca-certificates
          # Prefer runner-preinstalled pwsh; only fall back to a chmod'd archive.
          if ! command -v pwsh >/dev/null 2>&1; then
            curl -fsSL -o /tmp/pwsh.tgz \
              https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/powershell-7.4.6-linux-x64.tar.gz
            sudo mkdir -p /opt/microsoft/powershell/7
            sudo tar -xzf /tmp/pwsh.tgz -C /opt/microsoft/powershell/7
            sudo chmod +x /opt/microsoft/powershell/7/pwsh
            sudo ln -sfn /opt/microsoft/powershell/7/pwsh /usr/local/bin/pwsh
          fi
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion'
          # Nushell
          curl -fsSL -o /tmp/nu.tgz \
            https://github.com/nushell/nushell/releases/download/0.101.0/nu-0.101.0-x86_64-unknown-linux-gnu.tar.gz
          sudo tar -xzf /tmp/nu.tgz -C /tmp
          sudo install -m 0755 /tmp/nu-0.101.0-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu
          nu --version

      - name: E2E tests
        run: go test ./e2e/... -count=1 -timeout 10m

  docker:
    name: docker isolated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & run tests in Docker
        run: |
          chmod +x scripts/test-docker.sh
          ./scripts/test-docker.sh all

  install-script:
    name: install.sh syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: bash -n scripts/install.sh
