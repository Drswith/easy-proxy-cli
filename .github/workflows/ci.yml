name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./internal/... ./cmd/... -count=1

      - name: Build
        shell: bash
        run: |
          mkdir -p bin
          go build -o bin/ezp ./cmd/ezp

  e2e:
    name: e2e (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: E2E tests
        run: go test ./e2e/... -count=1 -timeout 5m

  docker:
    name: docker isolated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & run tests in Docker
        run: |
          chmod +x scripts/test-docker.sh
          ./scripts/test-docker.sh all

  install-script:
    name: install.sh syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: bash -n scripts/install.sh
